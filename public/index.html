  document.getElementById('sheetInner').innerHTML=`<div class="sh-head"><button class="back" onclick="closeSheet()">←</button><h2>${t('adddish')}</h2></div>
    <label>${t('dname')}</label><input id="dn" placeholder="${lang==='ta'?'எ.கா ரசம் சாதம்':'e.g. Rasam rice'}">
    <label>${t('ddesc')}</label><input id="dd" placeholder="${lang==='ta'?'மிளகு ரசம்':'Pepper rasam'}">
    <label>${t('dprice')}</label><input id="dp" type="number" placeholder="50">
    <div style="display:flex;gap:9px;margin-top:12px"><div id="v1" class="plan on" style="flex:1;justify-content:center" onclick="addVeg=true;v1.classList.add('on');v2.classList.remove('on')">🟢 ${t('veg')}</div><div id="v2" class="plan" style="flex:1;justify-content:center" onclick="addVeg=false;v2.classList.add('on');v1.classList.remove('on')">🔴 ${t('non')}</div></div>
    <button class="btn g full" id="savb" onclick="saveDish()">${t('save')}</button>`;showSheet();}
async function saveDish(){const n=document.getElementById('dn').value.trim();const d=document.getElementById('dd').value.trim();const p=parseInt(document.getElementById('dp').value)||0;
  if(!n||!p){toast(lang==='ta'?'பெயர் & விலை':'Name & price');return;}
  const b=document.getElementById('savb');b.disabled=true;b.textContent='...';
  try{await api('/api/cooks/'+LOGGED_COOK+'/menu',{method:'POST',body:JSON.stringify({name:n,description:d,price:p,veg:addVeg?1:0})});
    closeSheet();cookTab='menu';toast('✓ Saved');renderCook();}
  catch(e){toast(t('err'));b.disabled=false;b.textContent=t('save');}}

/* ============ ADMIN ============ */
async function renderAdmin(){
  loading();
  const [orders,reviews,cooks]=await Promise.all([api('/api/orders'),api('/api/reviews'),api('/api/cooks')]);
  document.getElementById('view').innerHTML=`
    <div class="top admin"><h1>${t('admintitle')}</h1><div class="sub">Owner · ${orders.length} ${lang==='ta'?'ஆர்டர்':'orders'}</div></div>
    <div class="wrap">
      <button class="btn full" style="background:#fff;color:var(--ink);border:1.5px solid var(--line);margin-top:0;margin-bottom:12px" onclick="renderAdmin()">🔄 Refresh</button>
      <div class="kpis"><div class="kpi"><b>${orders.length}</b><small>${lang==='ta'?'ஆர்டர்':'Orders'}</small></div><div class="kpi"><b>₹${orders.reduce((a,o)=>a+Math.round(o.total*0.15),0)}</b><small>${lang==='ta'?'கமிஷன்':'Commission'}</small></div><div class="kpi"><b>${cooks.length}</b><small>${lang==='ta'?'சமையல்':'Cooks'}</small></div></div>
      <div class="sec-title">${t('live')}</div>
      ${orders.length?`<div class="card" style="padding:6px"><table><tr><th>#</th><th>Cook</th><th>₹</th><th>${lang==='ta'?'நிலை':'Status'}</th><th></th></tr>
        ${orders.map(o=>`<tr><td><b>${o.id}</b></td><td>${o.cook_id}</td><td>₹${o.total}</td>
        <td>${o.locked?`<span class="badge b-lock">🔒</span>`:`<span class="badge ${o.status==='new'?'b-new':o.status==='cooking'?'b-cook':o.status==='out'?'b-out':'b-done'}">${o.status}</span>`}</td>
        <td><button class="mini2 ${o.locked?'unlockb':'lockb'}" onclick="toggleLock(${o.id},${o.locked?0:1})">${o.locked?t('unlock'):t('lock')}</button></td></tr>`).join('')}</table></div>`:`<div class="empty">${t('noord')}</div>`}
      <div class="sec-title">${t('reviews')}</div>
      ${reviews.length?reviews.map(o=>{const bad=o.stars<=2;return `<div class="review ${bad?'bad':''}"><div style="display:flex;justify-content:space-between"><b style="font-size:13px">Cook #${o.cook_id} · Order #${o.id}</b><span style="color:var(--gold)">${'★'.repeat(o.stars)}${'☆'.repeat(5-o.stars)}</span></div>${o.remark?`<div style="font-size:13px;margin:5px 0">"${o.remark}"</div>`:''}${bad?`<span style="font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;background:#fee2e2;color:#b91c1c">🚩 ${lang==='ta'?'கவனம்':'Attention'}</span>`:''}</div>`;}).join(''):`<div class="empty">${lang==='ta'?'விமர்சனம் இல்லை':'No reviews yet'}</div>`}
      <div class="sec-title">${t('allcooks')}</div>
      <div class="card" style="padding:6px"><table><tr><th>#</th><th>Name</th><th>★</th></tr>${cooks.map(c=>`<tr><td>${c.id}</td><td><b>${c.name}</b></td><td>★ ${c.rating}</td></tr>`).join('')}</table></div>
    </div>`;
}
async function toggleLock(id,v){try{await api('/api/orders/'+id+'/lock',{method:'PATCH',body:JSON.stringify({locked:v})});renderAdmin();}catch(e){toast(t('err'));}}

function showSheet(){document.getElementById('sheet').classList.add('show');}
function closeSheet(){document.getElementById('sheet').classList.remove('show');}
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});

function initLogin(){
  applyLoginLabels();
  // Owner/admin login is HIDDEN from normal users. It appears only when the URL ends with #owner
  if(location.hash==='#owner'||location.hash==='#admin'){
    document.getElementById('login-sub').textContent = lang==='ta'?'உரிமையாளர் உள்நுழைவு 🛠️':'Owner login 🛠️';
    document.getElementById('roleChoice').classList.add('hide');
    chooseRole('admin');
  }
}
initLogin();
</script>
</body>
</html>
